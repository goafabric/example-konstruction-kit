apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "application.fullname" . }}-redirect
spec:
  parentRefs:
    - name: apisix
      sectionName: http
  hostnames:
    - {{ .Values.ingress.hosts }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.paths }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "application.fullname" . }}
spec:
  parentRefs:
    - name: apisix
      namespace: ingress-apisix
      sectionName: https
  hostnames:
    - {{ .Values.ingress.hosts }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.paths }}
      backendRefs:
        - name: {{ include "application.fullname" . }}
          port: 8080

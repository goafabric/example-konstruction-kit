kind: ConfigMap
metadata:
  name: mapple-product-catalog
  namespace: kagent
data:
  products: |
    # Mapple product catalog

    Only these nine variations are valid for the guarantee return flow. Storage
    capacity, size, and finish are part of the product identity.

    A model name without a size is ambiguous when two rows share it. In that case the
    intake agent reports `UNKNOWN_PRODUCT` and asks for the exact variation.

    | Category | Display name | Variant | SKU | Common aliases |
    | --- | --- | --- | --- | --- |
    | myphone | myphone 15 | 128 GB, Black | `MP15-128-BLK` | myphone 15, MP15-128-BLK |
    | myphone | myphone 15 Pro | 256 GB, Blue Titanium | `MP15P-256-BLU` | myphone 15 pro, MP15P-256-BLU |
    | myphone | myphone 15 Pro Max | 512 GB, Natural Titanium | `MP15PM-512-TIT` | myphone 15 pro max, MP15PM-512-TIT |
    | mapbook | mapbook 13 | M3, 256 GB, Silver | `MB13-M3-256-SLV` | mapbook 13, MB13-M3-256-SLV |
    | mapbook | mapbook Pro 14 | M3 Pro, 512 GB, Space Gray | `MBP14-M3P-512-SPG` | mapbook pro 14, MBP14-M3P-512-SPG |
    | mapbook | mapbook Pro 16 | M3 Max, 1 TB, Silver | `MBP16-M3M-1TB-SLV` | mapbook pro 16, MBP16-M3M-1TB-SLV |
    | mapple watch | mapple Watch Series 9 | 41 mm, Aluminum, Midnight | `MW9-41-ALU-MID` | mapple watch series 9 41mm, MW9-41-ALU-MID |
    | mapple watch | mapple Watch Series 9 | 45 mm, Aluminum, Starlight | `MW9-45-ALU-STL` | mapple watch series 9 45mm, MW9-45-ALU-STL |
    | mapple watch | mapple Watch Ultra 2 | 49 mm, Titanium, Orange | `MWU2-49-TIT-ORG` | mapple watch ultra 2, MWU2-49-TIT-ORG |

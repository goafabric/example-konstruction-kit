apiVersion: v1
kind: ConfigMap
metadata:
  name: mapple-test-cases
  namespace: kagent
data:
  case-01-homer: |
    # Case 01 — Homer Simpson

    Hi Mapple support,

    This is Homer Simpson, customer number C-100234. Three months ago I bought a
    myphone 15 Pro Max, 512 GB, natural titanium. The battery is bulging and the
    screen is lifting up on the left side. I did not drop it and I did not get it
    wet — I was just eating a donut when I noticed it. Please fix or replace it.

    Thanks,
    Homer Simpson
  case-02-bart: |
    # Case 02 — Bart Simpson

    Hey Mapple,

    Bart Simpson here, customer number C-100987. I got the mapbook Pro 14 with the
    M3 Pro chip and 512 GB about five months ago. Okay, so maybe I was skateboarding
    with it in my backpack and it slipped off and hit the curb. The screen is cracked
    and the lid is bent. Can I still get it replaced under the guarantee? Ay caramba.

    Bart
  case-03-marge: |
    # Case 03 — Marge Simpson

    Dear Mapple customer service,

    I am Marge Simpson, customer number C-100455. I purchased a mapple Watch Series 9,
    41 mm, aluminum, midnight, seven months ago. The display now shows green lines and
    pixel errors, even though I have always worn it carefully and never dropped it. I
    have the receipt and can send photos. Please let me know how to proceed.

    Kind regards,
    Marge Simpson
  case-04-lisa: |
    # Case 04 — Lisa Simpson

    Hello Mapple,

    Lisa Simpson here, customer number C-100612. I bought a mapbook 13 with the M3
    chip and 256 GB about 30 months ago. The battery now dies after about 20 minutes,
    even after a full charge. I know the two-year period has passed, but I wanted to
    ask whether there is any goodwill option.

    Thank you,
    Lisa Simpson
  case-05-burns: |
    # Case 05 — Montgomery Burns

    To whom it may concern,

    This is Montgomery Burns. I demand an immediate replacement of my MyPhone 16
    Ultra. I purchased it recently and it is already defective. Do not waste my time
    with forms or questions; I am a very important customer.

    M. Burns

---

